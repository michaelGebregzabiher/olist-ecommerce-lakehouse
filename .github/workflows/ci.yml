name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint source code
        run: ruff check src tests

      - name: Run unit tests
        run: pytest


# Was passiert hier?
  # 1. GitHub startet bei einem Push oder Pull Request einen Workflow.
  # 2. Der Runner lädt dein Repository.
  # 3. Python und die Abhängigkeiten werden installiert.
  # 4. ruff prüft die Codequalität.
  # 5. pytest führt die Unit Tests aus.